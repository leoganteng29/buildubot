name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: Uploaded Flutter project ZIP path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flutter-apk-build-${{github.run_id}}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (Dart 3.8.1+)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: stable
          cache: true

      - name: Verify uploaded ZIP
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          if [ ! -f "$ZIP_PATH" ]; then
            ls "${ZIP_PATH}".part* > /dev/null 2>&1 || { echo "ZIP/part tidak ditemukan: $ZIP_PATH"; exit 1; }
            echo "Menyambung part ZIP ..."
            ls -1 "${ZIP_PATH}".part* | sort | xargs cat > "$ZIP_PATH"
          fi
          ls -l "$ZIP_PATH"
          unzip -t "$ZIP_PATH"
          mkdir -p flutter_project
          unzip -q "$ZIP_PATH" -d flutter_project

      - name: Locate Flutter project and build APK
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC=$(find flutter_project -type f -name pubspec.yaml -not -path '*/.dart_tool/*' | awk 'NR==1 {best=$0; n=length($0)} length($0)<n {best=$0; n=length($0)} END {print best}')
          if [ -z "$PUBSPEC" ]; then echo 'pubspec.yaml tidak ditemukan di dalam ZIP'; exit 1; fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "Flutter project: $PROJECT_DIR"
          echo "Flutter/Dart versions:"
          flutter --version
          cd "$PROJECT_DIR"
          flutter pub get
          GP=android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$GP" ]; then
            sed -i 's/-all.zip/-bin.zip/' "$GP"
            sed -i '/^networkTimeout=/d' "$GP"
            printf '\nnetworkTimeout=120000\n' >> "$GP"
            FILE=$(grep -oE 'gradle-[0-9.]+-(all|bin)[.]zip' "$GP" | head -1 | sed 's/-all[.]zip/-bin.zip/')
            if [ -n "$FILE" ]; then
              mkdir -p "$HOME/gradle-dist"; DEST="$HOME/gradle-dist/$FILE"; GOT=0
              for URL in "https://mirrors.cloud.tencent.com/gradle/$FILE" "https://repo.huaweicloud.com/gradle/$FILE" "https://downloads.gradle.org/distributions/$FILE" "https://services.gradle.org/distributions/$FILE"; do
                for t in 1 2 3; do
                  echo "Unduh Gradle: $URL (percobaan $t)"
                  if curl -fsSL --connect-timeout 20 --max-time 300 -o "$DEST" "$URL" && unzip -tq "$DEST" > /dev/null 2>&1; then GOT=1; break 2; fi
                  rm -f "$DEST"; sleep 5
                done
              done
              if [ "$GOT" = 1 ]; then
                sed -i '/^distributionUrl=/d;/^distributionSha256Sum=/d' "$GP"
                printf 'distributionUrl=file\\://%s\n' "$DEST" >> "$GP"
                echo 'Gradle diambil dari mirror dan dipakai lokal'; ls -l "$DEST"
              else
                echo 'Peringatan: semua mirror Gradle gagal, memakai URL bawaan project'; fi
            fi
            echo 'gradle-wrapper.properties:'; cat "$GP"
          fi
          mkdir -p ~/.gradle
          printf 'org.gradle.daemon=false\nsystemProp.org.gradle.internal.http.connectionTimeout=120000\nsystemProp.org.gradle.internal.http.socketTimeout=120000\nsystemProp.org.gradle.internal.repository.max.tentatives=6\nsystemProp.org.gradle.internal.repository.initial.backoff=2000\n' >> ~/.gradle/gradle.properties
          OK=0
          for i in 1 2 3; do
            echo "=== Build attempt $i/3 ==="
            if flutter build apk --release; then OK=1; break; fi
            sleep 20
          done
          [ "$OK" = 1 ] || { echo 'Build gagal setelah 3 percobaan'; exit 1; }
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK" || { echo 'APK release tidak ditemukan atau kosong'; exit 1; }
          echo "APK berhasil dibuat: $APK"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3
