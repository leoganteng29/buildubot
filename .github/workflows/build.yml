name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: Uploaded Flutter project ZIP path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flutter-apk-build-${{github.run_id}}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (Dart 3.8.1+)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: stable
          cache: true

      - name: Verify uploaded ZIP
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          if [ ! -f "$ZIP_PATH" ]; then
            ls "${ZIP_PATH}".part* > /dev/null 2>&1 || { echo "ZIP/part tidak ditemukan: $ZIP_PATH"; exit 1; }
            echo "Menyambung part ZIP ..."
            ls -1 "${ZIP_PATH}".part* | sort | xargs cat > "$ZIP_PATH"
          fi
          ls -l "$ZIP_PATH"
          unzip -t "$ZIP_PATH"
          mkdir -p flutter_project
          unzip -q "$ZIP_PATH" -d flutter_project

      - name: Locate Flutter project and build APK
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC=$(find flutter_project -type f -name pubspec.yaml -not -path '*/.dart_tool/*' | awk 'NR==1 {best=$0; n=length($0)} length($0)<n {best=$0; n=length($0)} END {print best}')
          if [ -z "$PUBSPEC" ]; then echo 'pubspec.yaml tidak ditemukan di dalam ZIP'; exit 1; fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "Flutter project: $PROJECT_DIR"
          echo "Flutter/Dart versions:"
          flutter --version
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK" || { echo 'APK release tidak ditemukan atau kosong'; exit 1; }
          echo "APK berhasil dibuat: $APK"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3
